<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>FinPay Frontend</title>
    <style>
        body {font-family: Arial, sans-serif; margin: 2rem;}
        .payment {border: 1px solid #ccc; padding: 0.5rem; margin: 0.5rem 0;}
    </style>
</head>
<body>
    <h1>FinPay Demo</h1>
    <h2>Create Payment</h2>
    <form id="paymentForm">
        <label>ID: <input type="number" name="id" required /></label><br/>
        <label>Sender: <input type="text" name="sender" required /></label><br/>
        <label>Receiver: <input type="text" name="receiver" required /></label><br/>
        <label>Amount: <input type="number" step="0.01" name="amount" required /></label><br/>
        <button type="submit">Submit</button>
    </form>
    <h2>Payments</h2>
    <div id="paymentsList"></div>

    <script>
        const apiBase = "http://127.0.0.1:8000"; // adjust if backend runs elsewhere
        async function loadPayments() {
            const resp = await fetch(`${apiBase}/payments`);
            const data = await resp.json();
            const container = document.getElementById('paymentsList');
            container.innerHTML = '';
            data.forEach(p => {
                const div = document.createElement('div');
                div.className = 'payment';
                div.textContent = `#${p.id} ${p.sender} → ${p.receiver}: ${p.amount} ${p.currency}`;
                container.appendChild(div);
            });
        }
        document.getElementById('paymentForm').addEventListener('submit', async e => {
            e.preventDefault();
            const form = e.target;
            const formData = new FormData(form);
            const payload = {};
            formData.forEach((v, k) => payload[k] = k === 'id' || k === 'amount' ? Number(v) : v);
            await fetch(`${apiBase}/payments`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            form.reset();
            loadPayments();
        });
        loadPayments();
    </script>
</body>
</html>
